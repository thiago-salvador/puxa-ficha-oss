name: CI

# Roda em pushes e em PRs de qualquer fork. Não usa segredos, então
# funciona para qualquer colaborador externo sem acesso à infra do projeto.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Falha em vulnerabilidade high+ nas dependencias de producao (o que vai
      # pro browser/runtime). devDependencies (CLIs locais) ficam fora do gate.
      - name: Audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Spellcheck (UI)
        run: npm run lint:spell:ui

      - name: Typecheck
        run: npm run typecheck

      # Os scripts de ingestão/auditoria têm tsconfig próprio e ficam fora do
      # typecheck do app; sem este passo, um script quebrado só falharia na
      # hora de rodar a ingestão agendada.
      - name: Typecheck (scripts)
        run: npm run check:scripts

      # Valida data/candidatos.json (contrato, slugs únicos, colisões de
      # nome_urna, SQ duplicado). Local e sem segredo, então roda em qualquer
      # PR de fork. Sem este gate, um seed inválido passa no CI e só explode
      # na ingestão.
      - name: Validar seed
        run: npm run validate:seed

      - name: Dead code (knip)
        run: npm run check:dead-code

      - name: Test
        run: npm test

      - name: Build
        # Valores de placeholder: o build não acessa o Supabase (as páginas
        # são renderizadas sob demanda). Um fork usa os próprios valores.
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  # Acessibilidade roda contra a producao publica, nao contra um build local.
  # Motivo: duas das seis rotas testadas (/candidato/lula e /doadores?q=silva)
  # so renderizam com dados reais, e o job `verify` e sem segredo por desenho,
  # para funcionar em PR de fork. Apontar PF_BASE_URL para o site publico
  # dispensa segredo e ainda testa o HTML que o usuario recebe de verdade.
  #
  # So em push na main: num PR de fork, a producao ainda nao tem o codigo do
  # PR, entao o resultado nao diria nada sobre a mudanca proposta.
  a11y:
    name: Acessibilidade (produção)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Axe (moderate, serious e critical)
        env:
          # Com PF_BASE_URL definida, o playwright.config nao sobe webServer.
          PF_BASE_URL: https://puxaficha.com.br
        run: npm run test:a11y

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: playwright-a11y-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
