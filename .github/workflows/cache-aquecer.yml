name: Aquecer cache e checar frescor

# Duas funcoes numa passada so, e a segunda depende da primeira.
#
# 1. AQUECER. O ISR do Next nao faz single-flight: medido em 03/08, 50
#    requisicoes simultaneas em 50 slugs frios geram 50 renders. Uma passada
#    previa transforma o pico do leitor em um render por ficha, feito por nos.
#
# 2. DETECTAR SITE CONGELADO NO PASSADO. Quando a revalidacao falha, o Next NAO
#    devolve erro: segue servindo o ultimo snapshot bom (medido em experimento
#    isolado nesta sessao). Isso protege o leitor e cega quem opera. Cada ficha
#    carrega `<meta name="pf-rendered-at">` com o horario do proprio render;
#    como este job acabou de tocar todas elas, carimbo velho aqui significa
#    regeneracao falhando em serie, e nao "ninguem visitou".
#
# A checagem so tem sentido acoplada ao aquecimento, por isso um job unico.

on:
  schedule:
    # De 3 em 3 horas. O teto de frescor e 4h, ou seja duas execucoes seguidas
    # precisam falhar antes de alertar: piscada isolada do Supabase nao vira
    # ruido, falha sustentada vira.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Origem a aquecer"
        required: false
        default: "https://puxaficha.com.br"

permissions:
  contents: read

concurrency:
  # Nunca duas passadas simultaneas: dobrariam a carga que o job existe para evitar.
  group: cache-aquecer
  cancel-in-progress: false

jobs:
  aquecer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Aquecer rotas publicas e checar frescor
        env:
          PF_BASE: ${{ inputs.base || 'https://puxaficha.com.br' }}
        run: |
          npm run cache:aquecer -- \
            --base="$PF_BASE" \
            --concorrencia=4 \
            --frescor-max-horas=4
